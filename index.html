<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deutsch 10 – Lernmodul Sprache & Rechtschreibung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f3ec; --card:#fffdf8; --ink:#1e2430; --muted:#5d6472; --line:#e3ddd0;
  --accent:#0f6b63; --accent-soft:#e2f1ee;
  --a:#2f7d4f; --a-soft:#e5f3ea; --m:#a8650f; --m-soft:#fbefdc; --e:#5b3fb0; --e-soft:#ece6fb;
  --ok:#1f7a45; --ok-soft:#dff3e6; --bad:#b4332b; --bad-soft:#fbe3e0; --warn:#b26b00; --warn-soft:#fff1d6;
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;line-height:1.2;margin:0 0 .4em}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
h4{margin:1.1em 0 .4em;font-size:1rem}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:10;background:rgba(246,243,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.5rem clamp(1rem,4vw,2.5rem) .55rem}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.4rem}
.topicbar{display:flex;flex-wrap:wrap;gap:.3rem}
.topicbar a{display:inline-flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:700;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:.18rem .6rem .18rem .3rem;white-space:nowrap}
.topicbar a b{display:inline-grid;place-items:center;min-width:1.35rem;height:1.35rem;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.75rem}
.topicbar a:hover{border-color:var(--accent)}
.topicbar a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.topicbar a.on b{background:#fff}
.topicbar a.done b{background:var(--ok);color:#fff}
.topicbar a.test{background:var(--e-soft);border-color:#d3c6f3;color:var(--e)}
.topicbar a.test.on{background:var(--e);color:#fff}
#tasks{scroll-margin-top:130px}
.time{font-size:.82rem;color:var(--muted)}
.result{background:#fff;border:2px solid var(--e);border-radius:var(--radius);padding:1.1rem 1.2rem;margin:1.5rem 0}
.result table{border-collapse:collapse;width:100%;margin:.6rem 0}
.result td,.result th{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left}
.result .big{font-family:"Fraunces",serif;font-size:2rem;font-weight:800;color:var(--e)}
.tcard.testcard{border:2px solid var(--e);background:var(--e-soft)}
.tcard.testcard .nr{color:var(--e)}

#topstat{display:flex;align-items:center;gap:.55rem;font-size:.88rem;color:var(--ink)}
#topstat .xpbar{width:110px;height:8px;background:#e6dfd1;border-radius:9px;overflow:hidden}
#topstat .xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f5a524,#e2552d);border-radius:9px;transition:width .6s}
#topstat .combo{color:#e2552d;font-weight:700}
.career{display:grid;grid-template-columns:minmax(230px,1fr) 2fr;gap:1rem;background:linear-gradient(135deg,#1e2430,#2c3346);color:#fff;border-radius:18px;padding:1.2rem 1.3rem;margin:1rem 0 1.6rem}
.career h2{color:#fff;font-size:1.15rem;margin:0 0 .5rem}
.career .rk{font-size:2.6rem;line-height:1}
.career .rn{font-family:"Fraunces",serif;font-size:1.6rem;font-weight:800}
.career .xpline{font-size:.9rem;opacity:.85;margin:.2rem 0 .5rem}
.career .bigbar{height:12px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.career .bigbar i{display:block;height:100%;background:linear-gradient(90deg,#f5a524,#e2552d)}
.ranks{display:flex;gap:.25rem;margin-top:.6rem;font-size:.75rem;flex-wrap:wrap;opacity:.9}
.ranks span{padding:.1rem .45rem;border-radius:99px;background:rgba(255,255,255,.1)}
.ranks span.cur{background:#f5a524;color:#1e2430;font-weight:700}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:.5rem}
.badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:.45rem .3rem;text-align:center;font-size:.72rem;line-height:1.2}
.badge .bi{font-size:1.7rem;display:block;margin-bottom:.2rem}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge.trophy{border-color:#f5a524;background:rgba(245,165,36,.15)}
.career .cta{margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;font-size:.85rem}
.career .btn{background:#f5a524;color:#1e2430}
.badgegoal{display:flex;gap:.6rem;align-items:center;background:#fff;border:1px dashed #d8c9a3;border-radius:12px;padding:.55rem .85rem;font-size:.93rem;margin:.6rem 0}
.badgegoal .bi{font-size:1.6rem}
.badgegoal.got{border:2px solid #f5a524;background:#fff8e6}
.tcard .bdg{position:absolute;top:.7rem;right:.8rem;font-size:1.5rem}
.tcard{position:relative}
#toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);display:flex;flex-direction:column;gap:.5rem;align-items:center;z-index:50;pointer-events:none}
.toast{background:#1e2430;color:#fff;border-radius:14px;padding:.6rem 1.1rem;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .45s cubic-bezier(.2,1.6,.4,1);transition:opacity .4s,transform .4s}
.toast.xp{background:#0f6b63}
.toast.combo{background:linear-gradient(90deg,#e2552d,#f5a524)}
.toast.badge,.toast.rank,.toast.trophy{background:linear-gradient(135deg,#5b3fb0,#2c3346);font-size:1.1rem;padding:.9rem 1.4rem}
.toast.out{opacity:0;transform:translateY(10px)}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.cert{max-width:760px;margin:1rem auto;background:#fffdf6;border:10px double #c9a43b;border-radius:6px;padding:2.2rem 2rem;text-align:center;box-shadow:0 10px 40px rgba(30,36,48,.12)}
.cert .kicker{letter-spacing:.3em;text-transform:uppercase;font-size:.8rem;color:#8a6d1d;font-weight:700}
.cert h1{font-size:clamp(2.2rem,6vw,3.4rem);margin:.3rem 0 .2rem;color:#2c3346}
.cert .nm{font:inherit;font-family:"Fraunces",serif;font-size:1.8rem;font-weight:800;text-align:center;border:0;border-bottom:2px solid #c9a43b;background:transparent;width:min(100%,420px);margin:1rem auto .3rem;display:block;color:var(--ink)}
.cert .nm:focus{outline:none;background:#fff6dc}
.cert .tro{font-size:4.2rem;line-height:1;margin:.8rem 0 .2rem}
.cert .facts{display:flex;justify-content:center;gap:1.6rem;flex-wrap:wrap;margin:1rem 0}
.cert .facts div{font-size:.85rem;color:var(--muted)}
.cert .facts b{display:block;font-size:1.2rem;color:var(--ink)}
.cert .bdgs{font-size:1.6rem;letter-spacing:.2rem;margin:.4rem 0}
.cert table{margin:1rem auto 0;border-collapse:collapse;font-size:.85rem;text-align:left}
.cert td,.cert th{padding:.2rem .6rem;border-bottom:1px solid #eee3c4}
.cert th{font-size:.75rem;color:var(--muted)}
.tstat{margin-left:auto;font-weight:700;border-radius:99px;padding:.05rem .55rem}
.tstat.first{background:var(--ok-soft);color:var(--ok)}.tstat.second{background:var(--warn-soft);color:var(--warn)}.tstat.none{background:#eee;color:var(--muted)}.tstat.warn{background:var(--bad-soft);color:var(--bad)}.tstat.done{background:var(--e-soft);color:var(--e)}
.tbody.locked{pointer-events:none;opacity:.8}
.cert .date{margin-top:1.2rem;font-size:.85rem;color:var(--muted)}

.arena{position:relative;overflow:hidden;border-radius:22px;margin:.6rem 0 1.6rem;color:#fff;background:radial-gradient(circle at 85% 15%,rgba(245,165,36,.35),transparent 40%),radial-gradient(circle at 10% 90%,rgba(91,63,176,.55),transparent 45%),linear-gradient(135deg,#141824,#262d42 60%,#1b2a3a)}
.arena::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(180deg,transparent,#000 40%,transparent)}
.arena-in{position:relative;padding:clamp(1.6rem,4vw,2.8rem)}
.arena .kick{display:inline-block;font-size:.78rem;letter-spacing:.25em;text-transform:uppercase;font-weight:700;color:#f5a524;border:1px solid rgba(245,165,36,.5);border-radius:99px;padding:.2rem .7rem;margin-bottom:.9rem}
.arena h1{color:#fff;font-size:clamp(2rem,5vw,3.3rem);max-width:22ch}
.tcard .cat{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:-.2rem}
.arena h1 span{background:linear-gradient(90deg,#f5a524,#ff6b3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.arena .lead{max-width:58ch;font-size:1.08rem;opacity:.92;margin:.6rem 0 1.2rem}
.arena .stats{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.4rem}
.arena .stats div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:.45rem .8rem;font-size:.82rem;opacity:.95}
.arena .stats b{display:block;font-family:"Fraunces",serif;font-size:1.5rem;color:#f5a524;line-height:1.1}
.arena .ctas{display:flex;flex-wrap:wrap;align-items:center;gap:1rem}
.play{display:inline-block;background:linear-gradient(90deg,#f5a524,#ff6b3d);color:#1e2430;font-weight:800;font-size:1.15rem;text-decoration:none;padding:.8rem 1.6rem;border-radius:14px;box-shadow:0 0 0 0 rgba(245,165,36,.6);animation:pulse 2.2s infinite}
.play:hover{filter:brightness(1.08)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,165,36,.55)}70%{box-shadow:0 0 0 16px rgba(245,165,36,0)}100%{box-shadow:0 0 0 0 rgba(245,165,36,0)}}
.arena .nxt{font-size:.92rem;opacity:.85}
.floaters span{position:absolute;font-size:2.2rem;opacity:.22;animation:float 7s ease-in-out infinite}
.floaters span:nth-child(1){right:8%;top:14%}
.floaters span:nth-child(2){right:24%;top:62%;animation-delay:-1.5s}
.floaters span:nth-child(3){right:6%;top:58%;font-size:3.2rem;animation-delay:-3s;opacity:.3}
.floaters span:nth-child(4){right:30%;top:10%;animation-delay:-4.5s}
.floaters span:nth-child(5){right:16%;top:36%;animation-delay:-2.2s}
.floaters span:nth-child(6){right:38%;top:78%;animation-delay:-5.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.floaters span,.play{animation:none}}
.sechead{margin:1.8rem 0 .6rem}
.sechead h2{margin:0 0 .2rem}
.sechead p{margin:0;color:var(--muted)}
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem}
.steps4>div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;font-size:.93rem;color:var(--muted)}
.steps4 b{display:block;color:var(--ink);font-size:1.02rem;margin:.3rem 0 .2rem}
.steps4 .n{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:10px;background:var(--accent);color:#fff;font-weight:800}
.xpbox{display:flex;gap:1.2rem;align-items:flex-start;background:#fff8e6;border:2px solid #f5c76a;border-radius:18px;padding:1.2rem 1.3rem;margin:1rem 0 0}
.xpicon{flex:0 0 auto;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-family:"Fraunces",serif;font-weight:800;font-size:1.5rem;color:#fff;background:linear-gradient(135deg,#f5a524,#e2552d);box-shadow:0 6px 16px rgba(226,85,45,.3)}
.xpbox h3{margin:.1rem 0 .4rem;font-size:1.25rem}
.xpbox p{margin:0 0 .5rem}
.xpbox ul{list-style:none;padding:0;margin:0 0 .8rem}
.xpbox li{margin:.25rem 0}
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem}
.ladder div{background:#fff;border:1px solid #f0d9a4;border-radius:12px;padding:.35rem .6rem;text-align:center;min-width:84px}
.ladder span{display:block;font-size:1.3rem}
.ladder b{display:block;font-size:.85rem}
.ladder small{color:var(--muted);font-size:.72rem}
.ladder i{font-style:normal;color:#d19a2a;font-weight:800}
@media (max-width:600px){.xpbox{flex-direction:column}.floaters{display:none}}
@media (max-width:700px){.career{grid-template-columns:1fr}#topstat .xpbar{width:60px}}
@media (max-width:700px){.topicbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:.2rem}}
.brand{font-family:"Fraunces",serif;font-weight:800;text-decoration:none;color:var(--ink);font-size:1.1rem}
.brand span{color:var(--accent)}
#topstat{font-size:.9rem;color:var(--muted)}
main{max-width:980px;margin:0 auto;padding:1.5rem clamp(1rem,4vw,2.5rem) 5rem}
.hero{padding:1.2rem 0 1rem}
.hero p{max-width:62ch;color:var(--muted);font-size:1.05rem}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem;margin:1.2rem 0 2rem}
.lvcard{border-radius:var(--radius);padding:1rem 1.1rem;border:1.5px solid}
.lvcard b{display:block;font-size:1.05rem;margin-bottom:.2rem}
.lvcard.a{background:var(--a-soft);border-color:#b9dfc8}.lvcard.a b{color:var(--a)}
.lvcard.m{background:var(--m-soft);border-color:#ecd3a8}.lvcard.m b{color:var(--m)}
.lvcard.e{background:var(--e-soft);border-color:#d3c6f3}.lvcard.e b{color:var(--e)}
.group{margin:1.8rem 0 .7rem;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.9rem}
.tcard{display:flex;flex-direction:column;gap:.35rem;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,36,48,.08)}
.tcard .nr{font-family:"Fraunces",serif;font-weight:800;color:var(--accent);font-size:1.4rem}
.tcard h3{margin:0}
.tcard p{margin:0;color:var(--muted);font-size:.93rem}
.bar{height:7px;background:#ece6da;border-radius:9px;overflow:hidden;margin-top:.5rem}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.prog{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:.5rem}
.chip{display:inline-block;font-size:.78rem;padding:.08rem .55rem;border-radius:99px;font-weight:700}
.chip.a{background:var(--a-soft);color:var(--a)}.chip.m{background:var(--m-soft);color:var(--m)}.chip.e{background:var(--e-soft);color:var(--e)}
.back{display:inline-flex;align-items:center;gap:.3rem;text-decoration:none;font-weight:700;margin-bottom:1rem}
.sub{color:var(--muted);margin-top:-.2rem}
.chooser{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;margin:1.2rem 0}
.chooser p{margin:.1rem 0 .7rem;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:.5rem}
.seg button{flex:1 1 200px;font:inherit;text-align:left;padding:.7rem .9rem;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;line-height:1.3}
.seg button small{display:block;color:var(--muted);font-size:.82rem}
.seg button.a.on{border-color:var(--a);background:var(--a-soft)}
.seg button.m.on{border-color:var(--m);background:var(--m-soft)}
.seg button.e.on{border-color:var(--e);background:var(--e-soft)}
.seg button:hover{border-color:#bdb5a5}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.pleasechoose{padding:1.2rem;border:2px dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--muted)}
.info{background:#fff;border-left:6px solid var(--accent);border-radius:var(--radius);padding:0;margin:1.2rem 0;box-shadow:0 1px 0 var(--line)}
.info>summary{cursor:pointer;padding:.9rem 1.1rem;font-weight:700;font-family:"Fraunces",serif;font-size:1.1rem;list-style:none}
.info>summary::-webkit-details-marker{display:none}
.info>summary::before{content:"ℹ️ "}
.info>summary::after{content:" ▾";color:var(--muted)}
.info[open]>summary::after{content:" ▴"}
.info .inner{padding:0 1.2rem 1.1rem}
.info table,.tbl{border-collapse:collapse;width:100%;margin:.6rem 0;font-size:.95rem}
.info th,.info td{border:1px solid var(--line);padding:.4rem .55rem;text-align:left;vertical-align:top}
.info th{background:var(--accent-soft)}
.example{padding:.5rem .8rem;border-radius:10px;margin:.4rem 0;font-size:.95rem}
.example.bad{background:var(--bad-soft)}.example.bad::before{content:"✘ ";color:var(--bad);font-weight:700}
.example.good{background:var(--ok-soft)}.example.good::before{content:"✔ ";color:var(--ok);font-weight:700}
.merke{background:var(--warn-soft);border-radius:10px;padding:.6rem .85rem;margin:.7rem 0 0}
.steps{background:var(--a-soft);border:1.5px solid #b9dfc8;border-radius:var(--radius);padding:.8rem 1.1rem;margin:1rem 0}
.steps b.t{color:var(--a)}
.steps ol{margin:.4rem 0 0;padding-left:1.3rem}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;margin:1.1rem 0}
.thead{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.45rem;font-size:.82rem}
.tnum{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.ttype{background:#efe9dd;border-radius:99px;padding:.05rem .55rem;color:var(--muted)}
.tscore{margin-left:auto;color:var(--muted)}
.prompt{margin:.2rem 0 .7rem}
.help{background:var(--a-soft);border-radius:10px;padding:.55rem .8rem;margin:.5rem 0 .8rem;font-size:.95rem}
details.help{background:var(--m-soft)}
details.help summary{cursor:pointer;font-weight:700;color:var(--m)}
details.help div{margin-top:.35rem}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:.55rem 1rem;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:.3rem .7rem;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fb{margin-top:.8rem;border-radius:10px;padding:0;font-weight:700}
.fb.show{padding:.6rem .85rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.mid{background:var(--warn-soft);color:var(--warn)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
/* MC */
.mcq{margin:.5rem 0 1rem}
.mcq .q{margin:.2rem 0 .4rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:.35rem}
.opt{display:flex;gap:.55rem;align-items:flex-start;padding:.45rem .7rem;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.opt input{margin-top:.3rem}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{font-size:.93rem;margin:.35rem 0 0;color:var(--muted)}
.minihint{font-size:.9rem;color:var(--a);margin:.35rem 0 0}
/* Gap */
.gaptext{line-height:2.3}
.gaptext p{margin:.2rem 0}
.gap{font:inherit;font-size:.98rem;border:0;border-bottom:2px solid #a9a191;background:#fbf8f1;border-radius:6px 6px 0 0;padding:.05rem .35rem;min-width:4.5rem;color:var(--ink)}
.gap:focus{outline:2px solid var(--accent);outline-offset:1px}
.gap.right{border-color:var(--ok);background:var(--ok-soft)}
.gap.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sol{font-size:.85rem;color:var(--ok);font-weight:700;margin-left:.2rem}
.bank{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem;border:1.5px dashed var(--line);border-radius:10px;margin-bottom:.8rem}
.bank span.lbl{font-size:.85rem;color:var(--muted);width:100%}
.bank button{font:inherit;font-size:.92rem;border:1px solid #d8d0bf;background:#fff;border-radius:8px;padding:.15rem .55rem;cursor:pointer}
.bank button.used{opacity:.4}
/* Comma */
.csent{display:flex;flex-wrap:wrap;align-items:baseline;padding:.55rem .4rem;border-bottom:1px solid var(--line);line-height:2}
.csent .cnt{font-size:.8rem;color:var(--muted);margin-left:.6rem;align-self:center}
.csent .num{font-weight:700;color:var(--muted);margin-right:.5rem;font-size:.85rem}
.slot{font:inherit;width:18px;height:1.6em;border:0;background:transparent;cursor:pointer;border-radius:5px;padding:0;position:relative;color:var(--ink);font-weight:700;font-size:1.15rem;line-height:1}
.slot::after{content:"";position:absolute;left:50%;top:60%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#cfc7b6}
.slot:hover{background:var(--accent-soft)}
.slot.on::after,.slot.miss::after,.slot.extra::after{display:none}
.slot.on{color:var(--accent)}
.slot.ok{color:var(--ok);background:var(--ok-soft)}
.slot.miss{color:var(--bad);background:var(--bad-soft)}
.slot.extra{color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.slot.done.ok::before{content:""}
.cw{white-space:nowrap}
.cmark{display:block;width:100%;font-size:.85rem;margin-top:.1rem}
/* Errors */
.etext{line-height:2.1;padding:.6rem .8rem;background:#fff;border:1px solid var(--line);border-radius:10px}
.unit{cursor:pointer;border-radius:5px;padding:.05rem .12rem;transition:background .1s}
.unit:hover{background:#f0ebe0}
.unit.mk{background:#ffe2a8;box-shadow:inset 0 -2px 0 var(--warn)}
.unit.found{background:var(--ok-soft);box-shadow:inset 0 -2px 0 var(--ok)}
.unit.missed{background:var(--warn-soft);box-shadow:inset 0 -2px 0 var(--warn)}
.unit.falsemk{background:var(--bad-soft);text-decoration:line-through}
.unit sup{font-size:.75rem;color:var(--ok);font-weight:700;margin-left:.15rem}
.legend{font-size:.88rem;color:var(--muted);margin-top:.5rem}
.legend span{display:inline-block;margin-right:.8rem}
/* Sort */
.srow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid var(--line)}
.srow .it{flex:1 1 280px}
.pills{display:flex;flex-wrap:wrap;gap:.35rem}
.pill{font:inherit;font-size:.86rem;border:1.5px solid #d8d0bf;background:#fff;border-radius:99px;padding:.2rem .65rem;cursor:pointer}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.right{background:var(--ok);border-color:var(--ok);color:#fff}
.pill.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.pill.should{border-color:var(--ok);color:var(--ok);border-style:dashed}
/* Order */
.pool,.answer{display:flex;flex-direction:column;gap:.4rem;min-height:3rem;padding:.6rem;border-radius:10px}
.pool{border:1.5px dashed var(--line)}
.answer{background:#fff;border:1.5px solid var(--line);margin-bottom:.6rem}
.answer:empty::before{content:"Klicke unten die Sätze in der richtigen Reihenfolge an …";color:var(--muted);font-size:.92rem}
.piece{font:inherit;text-align:left;border:1px solid #d8d0bf;background:#fbf8f1;border-radius:9px;padding:.45rem .7rem;cursor:pointer}
.piece.fixed{cursor:default;opacity:.85;border-style:dashed}
.piece.right{background:var(--ok-soft);border-color:var(--ok)}
.piece.wrong{background:var(--bad-soft);border-color:var(--bad)}
.olabel{font-size:.85rem;color:var(--muted);margin:.2rem 0}
/* Transform / write / fix */
.titem{margin:.4rem 0 1rem}
.src{background:#fbf8f1;border-left:4px solid #d2c8b3;padding:.45rem .7rem;border-radius:0 8px 8px 0;margin-bottom:.35rem}
textarea,.tin{font:inherit;width:100%;border:1.5px solid #d4ccba;border-radius:10px;padding:.55rem .7rem;background:#fff;color:var(--ink)}
textarea{min-height:9rem;resize:vertical;line-height:1.6}
textarea:focus,.tin:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.tin.right{border-color:var(--ok);background:var(--ok-soft)}
.tin.wrong{border-color:var(--warn);background:var(--warn-soft)}
.model{background:var(--ok-soft);border-radius:10px;padding:.6rem .85rem;margin-top:.5rem;font-size:.95rem}
.model b{color:var(--ok)}
.starters{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0 .6rem}
.starters button{font:inherit;font-size:.88rem;border:1px dashed var(--a);color:var(--a);background:#fff;border-radius:8px;padding:.2rem .55rem;cursor:pointer}
.analysis{margin-top:.7rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem .85rem;font-size:.95rem}
.analysis ul{margin:.3rem 0;padding-left:1.1rem}
.analysis li.ok::marker{content:"✔ ";color:var(--ok)}
.analysis li.no::marker{content:"✘ ";color:var(--bad)}
.analysis li.inf::marker{content:"• "}
.check{margin-top:.6rem}
.check label{display:flex;gap:.5rem;align-items:flex-start;margin:.2rem 0;font-size:.95rem}
.diff{line-height:2;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin-top:.5rem}
.diff .x{background:var(--bad-soft);box-shadow:inset 0 -2px 0 var(--bad);border-radius:4px;padding:0 .1rem}
.src-src{font-style:italic}
.reset-wrap{margin-top:3rem;text-align:center;font-size:.9rem;color:var(--muted)}
.foot-nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.foot-nav a{font-weight:700;text-decoration:none}
@media (pointer:coarse){
.slot{width:30px;height:2.1em;margin:0 1px}
.slot::after{width:6px;height:6px;margin-left:-3px;background:#bfb6a3}
.csent{line-height:2.4}
.unit{padding:.2rem .3rem;margin:.05rem 0;display:inline-block;line-height:1.5}
.pill{padding:.45rem .85rem;font-size:.92rem}
.piece{padding:.7rem .9rem}
.opt{padding:.7rem .9rem}
.opt input{transform:scale(1.3);margin-right:.2rem}
.btn{padding:.7rem 1.15rem}
.gap{min-height:2.1em;font-size:1rem}
.bank button,.starters button{padding:.4rem .7rem}
.topicbar a{padding:.35rem .75rem .35rem .4rem}
.topicbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.25rem;scrollbar-width:none}
.topicbar::-webkit-scrollbar{display:none}
}
*{-webkit-tap-highlight-color:transparent}
.slot,.unit,.pill,.piece{touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media (max-width:600px){body{font-size:16px}.task{padding:.9rem}.slot{width:16px}}

{id:'schachtelsaetze',title:'Schachtelsätze vermeiden',short:'Lange, verschachtelte Sätze erkennen und verständlich umformulieren.',group:'Stil & Textgestaltung',
info:`<p>Ein <b>Schachtelsatz</b> ist ein sehr langer Satz, in dem mehrere Nebensätze ineinander „verschachtelt“ sind. Oft steht das wichtigste Verb des Hauptsatzes erst ganz am Ende – bis dahin haben Lesende den Faden verloren.</p>
<div class="example bad">Der Spieler, der, weil er, als das Turnier begann, krank war, nicht trainieren konnte, verlor.</div>

<h4>So entschachtelst du Sätze</h4>
<ol><li><b>Kern finden:</b> Wer macht was? Suche Subjekt und Prädikat des Hauptsatzes.</li>
<li><b>Aufteilen:</b> Mache aus Nebensätzen eigene Hauptsätze.</li>
<li><b>Ordnen:</b> Erzähle in zeitlicher oder logischer Reihenfolge.</li>
<li><b>Verknüpfen:</b> Verbinde die Sätze mit Konnektoren wie <i>deshalb, danach, außerdem, trotzdem</i>, damit der Zusammenhang erhalten bleibt.</li>
<li><b>Nebensätze nicht einschieben:</b> Wenn du einen Nebensatz behältst, stelle ihn vor oder hinter den Hauptsatz – nicht mitten hinein.</li></ol>
<p class="merke"><b>Faustregel:</b> Sätze mit mehr als ca. 20 Wörtern solltest du prüfen. Aber Vorsicht: Nur ganz kurze Sätze wirken abgehackt – die Mischung macht’s.</p>`,

 {q:'Was ist das Hauptproblem eines Schachtelsatzes?',o:['Er enthält zu viele Adjektive.','Lesende müssen sich viele Informationen merken, bevor der Satzkern klar wird.','Er hat keine Kommas.'],c:1,x:'Die Satzklammer bleibt zu lange offen – das Gedächtnis wird überlastet.'}

{type:'order',title:'Den Schachtelsatz auflösen: Reihenfolge',prompt:'Dieser Schachtelsatz wurde in einzelne Sätze zerlegt: <i>„Der Blogger, der, nachdem er eine Übertragung, bei der mehrere Spieler aus Europa ein Ego-Shooter-Spiel spielten, gesehen hatte, an die Debatte um Killerspiele erinnert wurde, fragte seine Leser nach ihrer Meinung.“</i><br>Bringe die Sätze in eine logische Reihenfolge.',

{type:'write',title:'Schachtelsatz umschreiben',prompt:'Löse den folgenden Schachtelsatz in mehrere verständliche Sätze auf. Kein Satz sollte länger als 15 Wörter sein.',

{id:'synonyme-kohaerenz',title:'Synonyme sinnvoll verwenden & Textkohärenz verbessern',short:'Wiederholungen vermeiden und Sätze so verknüpfen, dass ein roter Faden entsteht.',group:'Stil & Textgestaltung',
info:`<p><b>Kohärenz</b> bedeutet: Ein Text hängt inhaltlich und sprachlich zusammen – die Leserinnen und Leser erkennen einen „roten Faden“.</p>
<table><tr><th>Mittel</th><th>Beispiel</th></tr>
<tr><td><b>Synonyme</b> (bedeutungsgleiche/-ähnliche Wörter)</td><td>Spieler → Profis, Gamer; kritisieren → bemängeln</td></tr>
<tr><td><b>Oberbegriffe / Umschreibungen</b></td><td>Ego-Shooter → diese Computerspiele, das umstrittene Genre</td></tr>
<tr><td><b>Pronomen</b> (Rückverweis)</td><td>Die Autorin … <u>Sie</u> betont …; das Turnier … <u>dort</u></td></tr>
<tr><td><b>Konnektoren</b> (Verknüpfungswörter)</td><td>deshalb, außerdem, trotzdem, denn, zum Beispiel</td></tr></table>
<h4>Konnektoren nach Funktion</h4>
<table><tr><th>Begründung</th><th>Folge</th><th>Gegensatz/Einräumung</th><th>Ergänzung</th></tr>
<tr><td>weil, da, denn, nämlich</td><td>deshalb, daher, folglich, somit</td><td>aber, jedoch, trotzdem, allerdings</td><td>außerdem, zudem, darüber hinaus</td></tr></table>
<p class="merke"><b>Achtung bei Synonymen:</b> Sie müssen (1) im Kontext dieselbe Bedeutung haben, (2) zur <b>Stilebene</b> passen („zocken“ ist umgangssprachlich und passt nicht in einen sachlichen Text) und (3) Pronomen brauchen einen <b>eindeutigen Bezug</b>.</p>`,
steps:`<ol><li>Markiere Wörter, die sich ständig wiederholen.</li><li>Überlege: Gibt es ein Synonym, einen Oberbegriff oder ein Pronomen?</li><li>Prüfe, ob das neue Wort wirklich passt (Bedeutung, Stil).</li><li>Verbinde Sätze mit Konnektoren aus der Tabelle.</li></ol>`,

 {q:'„Viele Experten kritisieren Ego-Shooter. Sie ___ vor allem die Gewaltdarstellung.“',o:['meckern über','loben','bemängeln'],c:2,h:'Gesucht ist ein sachliches Wort mit ähnlicher Bedeutung wie „kritisieren“.',x:'„bemängeln“ ist sachlich und bedeutungsähnlich.'},
 {q:'Welcher Oberbegriff fasst „Ego-Shooter, Strategiespiele und Rollenspiele“ zusammen?',o:['Sportarten','Computerspiele','Waffen'],c:1,x:'Alle drei sind Genres von Computerspielen.'},
 {q:'„Die Autorin sprach mit ihrer Oma über die Wii-Konsole. Sie fand sie toll.“ Was ist hier das Problem?',o:['Der Bezug der Pronomen ist unklar.','Es fehlt ein Komma.','Der Satz ist zu lang.'],c:0,h:'Wen oder was meint „Sie“ – und wen „sie“?',x:'Es bleibt offen, ob die Autorin oder die Oma etwas toll fand – und ob die Oma oder die Konsole gemeint ist.'}
 ]},
{type:'gap',title:'Konnektoren einsetzen',prompt:'Setze das passende Verknüpfungswort ein.',
 text:`<p>E-Sport ist bei Jugendlichen sehr beliebt. [[Allerdings|Deshalb|Zum Beispiel]] warnen einige Experten vor Suchtgefahr.</p><p>Die Profis trainieren täglich bis zu acht Stunden. [[Deshalb|Trotzdem|Obwohl]] sind sie bei Turnieren so präzise.</p><p>Sie trainieren nicht nur am Computer. [[Außerdem|Folglich|Dennoch]] gehen viele regelmäßig joggen.</p><p>Die Spiele sind erst ab 16 Jahren freigegeben. [[Trotzdem|Daher|Außerdem]] spielen auch jüngere Kinder sie.</p><p>Die Autorin besucht ihre Oma im Altenheim. [[Dort|Damals|Deshalb]] spielen die Bewohner Bowling an der Wii-Konsole.</p>`,

 source:'E-Sport ist sehr beliebt. E-Sport füllt ganze Stadien. E-Sport wird auch im Internet übertragen. Die E-Sport-Spieler trainieren jeden Tag. Die E-Sport-Spieler müssen sehr konzentriert sein. Die E-Sport-Spieler verdienen bei großen Turnieren viel Geld. E-Sport ist aber auch umstritten.',

{id:'redewiedergabe',title:'Arten der Redewiedergabe unterscheiden & trainieren',short:'Direkte Rede, indirekte Rede mit Konjunktiv und Redebericht sicher verwenden.',group:'Stil & Textgestaltung',
info:`<table><tr><th>Art</th><th>Beispiel</th></tr>
<tr><td><b>Direkte Rede</b> (wörtlich, in Anführungszeichen)</td><td>Heidi schreibt: „Das muss verboten werden.“</td></tr>
<tr><td><b>Indirekte Rede</b> (Konjunktiv I)</td><td>Heidi schreibt, das müsse verboten werden.</td></tr>
<tr><td><b>Redebericht</b> (Inhalt zusammengefasst, mit redeeinleitendem Verb)</td><td>Heidi fordert ein Verbot von Ego-Shootern.</td></tr>
<tr><td><b>Wiedergabe mit Präposition</b></td><td><i>Laut</i> Heidi / Heidi <i>zufolge</i> / <i>Nach Ansicht von</i> Heidi sind Ego-Shooter gefährlich.</td></tr></table>
<h4>Konjunktiv I bilden: Stamm + Endung</h4>
<table><tr><th>Verb</th><th>Indikativ</th><th>Konjunktiv I</th><th>Ersatzform (wenn Konj. I = Indikativ)</th></tr>
<tr><td>sein</td><td>er ist / sie sind</td><td>er sei / sie seien</td><td>–</td></tr>
<tr><td>haben</td><td>er hat / sie haben</td><td>er habe / <s>sie haben</s></td><td>sie <b>hätten</b> (Konjunktiv II)</td></tr>
<tr><td>können</td><td>er kann</td><td>er könne</td><td>–</td></tr>
<tr><td>spielen</td><td>er spielt / sie spielen</td><td>er spiele / <s>sie spielen</s></td><td>sie <b>würden spielen</b> (da „spielten“ = Präteritum)</td></tr></table>
<h4>Beim Umformen anpassen</h4>
<ul><li><b>Pronomen:</b> ich → er/sie, wir → sie, mich → ihn/sie</li><li><b>Orts- und Zeitangaben:</b> hier → dort, heute → an diesem Tag</li><li><b>Fragen:</b> mit Fragewort oder „ob“ einleiten: <i>Sie fragt, ob …</i></li></ul>
<h4>Zeichensetzung bei direkter Rede</h4>
<ul><li>Begleitsatz <b>vorn</b>: Doppelpunkt → Eddy sagt: „Ich trainiere jeden Tag.“</li><li>Begleitsatz <b>hinten</b>: Komma nach dem Anführungszeichen, Punkt fällt weg → „Ich trainiere jeden Tag“, sagt Eddy.</li><li>Frage- und Ausrufezeichen bleiben → „Wann beginnt das Turnier?“, fragt Lisa.</li></ul>
<p class="merke"><b>Redeeinleitende Verben</b> zeigen die Haltung: behaupten, betonen, fordern, kritisieren, einräumen, bezweifeln, vertreten (eine Meinung), widersprechen …</p>`,
steps:`<ol><li>Unterstreiche das Verb in der wörtlichen Rede.</li><li>Bilde den Konjunktiv I: Verbstamm + <b>-e</b> (er spiel<b>e</b>, er hab<b>e</b>), bei „sein“: sei.</li><li>Klingt es wie der Indikativ? Dann nimm „hätten“, „wären“ oder „würden“.</li><li>Passe die Pronomen an (ich → er/sie).</li></ol>`,
tasks:[
{type:'sort',title:'Welche Art der Redewiedergabe ist das?',prompt:'Ordne jeden Satz der passenden Art zu.',
 cats:['direkte Rede','indirekte Rede','Redebericht','mit Präposition'],
 items:[{t:'Heidi schreibt: „Das muss verboten werden.“',c:0},{t:'Heidi schreibt, das müsse verboten werden.',c:1},{t:'Heidi fordert ein Verbot von Ego-Shootern.',c:2},{t:'Laut Heidi sollten Ego-Shooter verboten werden.',c:3},{t:'„Warum sollte mich ein Spiel dazu bringen, Leute umzulegen?“, fragt Michael Schmitz.',c:0},{t:'Spitzer zufolge führt der Konsum zu mehr Aggression.',c:3},{t:'Dani räumt ein, Gewaltdarstellungen könne man kritisieren.',c:1},{t:'Die Autorin plädiert für einen offenen Umgang mit Computerspielen.',c:2}],
 help:{a:'Anführungszeichen → direkte Rede. Konjunktiv (müsse, könne, sei) → indirekte Rede. Nur der Inhalt mit einem Verb wie „fordert“ → Redebericht. „laut/zufolge“ → Präposition.'}},
{type:'gap',title:'Den Konjunktiv bilden',prompt:'Setze das Verb in der richtigen Form der indirekten Rede ein.',

{id:'fehlerdiagnose',title:'Richtig schreiben – Fehler diagnostizieren',short:'Fehlerarten erkennen, passende Rechtschreibstrategien anwenden, eigene Texte prüfen.',group:'Rechtschreibung',
info:`<p>Wer seine Fehler <b>diagnostiziert</b>, also herausfindet, welche Art von Fehler er macht, kann gezielt üben. Lege dazu ein <b>Fehlerprotokoll</b> an: falsches Wort – richtiges Wort – Fehlerart – Strategie.</p>
<table><tr><th>Kürzel</th><th>Fehlerart</th><th>Beispiel</th></tr>
<tr><td>GK</td><td>Groß-/Kleinschreibung</td><td>beim <s>zocken</s> → beim Zocken</td></tr>
<tr><td>GZ</td><td>Getrennt-/Zusammenschreibung</td><td><s>teil nehmen</s> → teilnehmen</td></tr>
<tr><td>DD</td><td>das/dass</td><td>Ich hoffe, <s>das</s> → dass …</td></tr>
<tr><td>S</td><td>s-Laute</td><td><s>Spass</s> → Spaß</td></tr>
<tr><td>D</td><td>Dehnung/Schärfung</td><td><s>trainiren</s> → trainieren, <s>gewan</s> → gewann</td></tr>
<tr><td>W</td><td>Wortstamm/Ableitung</td><td><s>endtäuscht</s> → enttäuscht</td></tr></table>
<h4>Rechtschreibstrategien</h4>
<ul><li><b>Verlängern:</b> Gewinn – Gewin<u>ne</u> → Doppel-n hörbar; Ta<u>g</u> – Ta<u>g</u>e</li>
<li><b>Ableiten:</b> läuft ← laufen; Räume ← Raum</li>
<li><b>Zerlegen:</b> Freundschaft|s|spiel, ent|täuscht</li>
<li><b>Artikel-/Signalwortprobe:</b> beim Zocken, das Spielen → groß</li>
<li><b>Ersatzprobe:</b> das → dieses/welches möglich? Sonst „dass“</li>
<li><b>Merkwörter / Nachschlagen:</b> Vater, Rhythmus, Shooter</li></ul>`,
steps:`<ol><li>Lies den Text Wort für Wort – am besten halblaut.</li><li>Frage bei jedem Nomen: Steht es groß?</li><li>Bei unsicheren Wörtern: verlängern oder ableiten.</li><li>Bei „das/dass“: Ersatzprobe mit „dieses/welches“.</li></ol>`,

{id:'getrennt-zusammen',title:'Getrennt- und Zusammenschreibung',short:'Rad fahren oder radfahren? Die wichtigsten Regeln sicher anwenden.',group:'Rechtschreibung',
info:`<table><tr><th>Regel</th><th>Beispiele</th></tr>
<tr><td><b>Verb + Verb</b> → meist getrennt</td><td>spazieren gehen, schwimmen lernen</td></tr>
<tr><td><b>Nomen + Verb</b> → meist getrennt</td><td>Rad fahren, Fußball spielen, Auto fahren</td></tr>
<tr><td>… aber zusammen, wenn das Nomen „verblasst“ ist</td><td>teilnehmen, stattfinden, leidtun, eislaufen, standhalten</td></tr>
<tr><td><b>Adjektiv + Verb</b> → getrennt bei wörtlicher Bedeutung</td><td>laut lesen, schnell laufen</td></tr>
<tr><td>… zusammen bei neuer (übertragener) Bedeutung</td><td>schwarzfahren (ohne Ticket), schwerfallen (Mühe machen), krankschreiben</td></tr>
<tr><td><b>Verbindungen mit „sein“</b> → immer getrennt</td><td>da sein, fertig sein, zusammen sein</td></tr>
<tr><td><b>Nominalisierungen</b> → immer zusammen und groß</td><td>das Radfahren, beim Fußballspielen, zum Spazierengehen</td></tr>
<tr><td><b>Betonung entscheidet</b> bei Partikeln</td><td>sich <u>wie</u>dersehen (treffen) – wieder <u>se</u>hen (erneut sehen können)</td></tr>
<tr><td><b>irgend-</b> → immer zusammen</td><td>irgendwann, irgendjemand, irgendetwas</td></tr>
<tr><td><b>Mal</b></td><td>einmal, dreimal – aber: jedes Mal, zum ersten Mal</td></tr></table>
<p class="merke"><b>Trick:</b> Steht ein Artikel oder „beim/zum“ davor? Dann wird die ganze Verbindung zum Nomen: <i>beim Radfahren</i>.</p>`,
steps:`<ol><li>Steht „beim/zum/das“ davor? → zusammen und groß.</li><li>Ist es wörtlich gemeint (laut lesen) oder übertragen (schwarzfahren)?</li><li>Ist „sein“ dabei? → immer getrennt.</li><li>Im Zweifel: Wörterbuch nutzen.</li></ol>`,
tasks:[
{type:'gap',title:'Getrennt oder zusammen?',prompt:'Wähle bzw. schreibe die richtige Schreibweise.',mMode:'input',
 text:`<p>1. Am Wochenende wollen wir [[Rad fahren|radfahren|Radfahren]].</p><p>2. Beim [[Radfahren|Rad fahren|radfahren]] trage ich immer einen Helm.</p><p>3. Das Turnier wird im August in Köln [[stattfinden|statt finden]].</p><p>4. Viele Schülerinnen möchten am Turnier [[teilnehmen|teil nehmen]].</p><p>5. Es wird dir sicher nicht [[schwerfallen|schwer fallen]], die Regeln zu lernen.</p><p>6. Ich habe [[jedes Mal|jedesmal]] verloren.</p><p>7. Kannst du morgen um acht Uhr [[da sein|dasein]]?</p><p>8. Ich hoffe, wir werden uns bald [[wiedersehen|wieder sehen]].</p><p>9. Nach der Augenoperation konnte er endlich [[wieder sehen|wiedersehen]].</p><p>10. Er ist ohne Ticket [[schwarzgefahren|schwarz gefahren]].</p>`,
 help:{a:'Satz 2: „Beim“ macht ein Nomen daraus. Satz 5 und 10: übertragene Bedeutung. Satz 7: Verbindungen mit „sein“. Satz 8/9: Betonung beachten.',m:'Denke an Nominalisierung, übertragene Bedeutung und die „sein“-Regel.'}},
{type:'sort',title:'Regeln zuordnen',prompt:'Welche Regel erklärt die Schreibweise?',

 items:[{t:'beim Fußballspielen',c:0},{t:'Fußball spielen',c:4},{t:'krankschreiben',c:1},{t:'teilnehmen',c:2},{t:'fertig sein',c:3},{t:'das Autofahren',c:0},{t:'stattfinden',c:2},{t:'Klavier spielen',c:4},{t:'schwarzfahren',c:1},{t:'zusammen sein',c:3}],

{id:'gross-klein',title:'Groß- und Kleinschreibung',short:'Nominalisierungen, Signalwörter, Tageszeiten und Höflichkeitsanrede.',group:'Rechtschreibung',
info:`<h4>Großgeschrieben werden</h4>
<ul><li>Satzanfänge und <b>Nomen</b></li>
<li><b>Nominalisierungen</b> (Verben/Adjektive als Nomen), erkennbar an <b>Signalwörtern</b>:<br>Artikel: <i>das Spielen</i> · verschmolzene Präpositionen: <i>beim Zocken, zum Trainieren, im Allgemeinen</i> · Pronomen: <i>dein Lachen</i> · Mengenwörter: <i>etwas Neues, nichts Besonderes, viel Gutes, alles Gute</i></li>
<li>Tageszeiten nach <i>heute, gestern, morgen</i>: <i>heute Abend, gestern Mittag</i></li>
<li>die <b>Höflichkeitsanrede</b>: <i>Sie, Ihnen, Ihr</i> (Anrede einer Person, die man siezt)</li>
<li>Eigennamen: <i>die Deutsche Welle, der Kölner Dom</i></li></ul>
<h4>Kleingeschrieben werden</h4>
<ul><li>Tageszeiten/Wochentage mit <b>-s</b>: <i>abends, montags</i></li>
<li>Superlative mit „am“: <i>am besten, am schnellsten</i></li>
<li>unbestimmte Zahlwörter: <i>die meisten, die beiden, die vielen, die anderen</i></li>
<li>Adjektive, die sich auf ein vorangehendes oder folgendes Nomen beziehen: <i>Das rote Trikot gefällt mir besser als das blaue.</i></li></ul>
<p class="merke"><b>Artikelprobe:</b> Kann ich „das/beim/etwas“ davorsetzen und ergibt sich ein Sinn? Dann ist es wahrscheinlich eine Nominalisierung.</p>`,
steps:`<ol><li>Suche vor dem Wort nach einem Signalwort (das, beim, zum, etwas, nichts, viel, alles).</li><li>Gefunden? → groß.</li><li>Endet eine Zeitangabe auf -s (abends)? → klein.</li><li>„am …sten“ → klein.</li></ol>`,
tasks:[
{type:'gap',title:'Groß oder klein?',prompt:'Wähle bzw. schreibe die richtige Schreibweise.',mMode:'input',
 text:`<p>1. Beim [[Zocken|zocken]] vergesse ich manchmal die Zeit.</p><p>2. Wir wünschen dir alles [[Gute|gute]] für das Turnier.</p><p>3. Das Finale findet heute [[Abend|abend]] statt.</p><p>4. Ich trainiere meistens [[abends|Abends]].</p><p>5. Dieses Team spielt am [[besten|Besten]].</p><p>6. Auf der Messe gab es nichts [[Besonderes|besonderes]].</p><p>7. Im [[Allgemeinen|allgemeinen]] sind die Spieler sehr fair.</p><p>8. Die [[meisten|Meisten]] kamen mit dem Zug.</p><p>9. Liebe Frau Schmitz, haben [[Sie|sie]] das Turnier gesehen?</p><p>10. Das ist das [[Spannendste|spannendste]], was ich je gesehen habe.</p><p>11. Er hat auf der Gamescom viel [[Neues|neues]] entdeckt.</p>`,
 help:{a:'Suche Signalwörter: beim, alles, nichts, im, das, viel → groß. „heute Abend“ → groß. „abends“, „am besten“, „die meisten“ → klein. Satz 9: Höflichkeitsanrede.',m:'Achte auf Signalwörter – und auf die Ausnahmen (am …sten, -s-Zeitangaben, die meisten).'}},
{type:'sort',title:'Signalwort oder nicht?',prompt:'Kündigt das Wort eine Großschreibung (Nominalisierung) an?',
 cats:['Signalwort → groß','kein Signalwort'],

 help:{a:'Artikel, „beim/zum/im“ und Mengenwörter (etwas, nichts, alles, viel) sind Signalwörter. Achtung: „am“ + Superlativ wird kleingeschrieben!'}},

{id:'kommas-satzgefuege',title:'Kommas in komplexen Satzgefügen',short:'Haupt- und Nebensätze erkennen, eingeschobene Nebensätze und Infinitivgruppen.',group:'Zeichensetzung',
info:`<p>Ein <b>Satzgefüge</b> besteht aus mindestens einem Hauptsatz (HS) und einem Nebensatz (NS). <b>Nebensätze werden immer durch Komma abgetrennt</b> – auch voneinander.</p>
<h4>Woran erkennst du einen Nebensatz?</h4>
<ul><li>Er beginnt mit einem <b>Einleitewort</b>: Subjunktion (<i>weil, dass, obwohl, wenn, nachdem, als, damit</i>), Relativpronomen (<i>der, die, das, welche, dessen</i>) oder Fragewort (<i>ob, wie, warum, wann</i>).</li>
<li>Das <b>gebeugte Verb steht am Ende</b>: …, weil die Turniere lange <u>dauern</u>.</li></ul>
<h4>Stellung des Nebensatzes</h4>
<div class="example good">Vorangestellt: <b>Weil die Turniere lange dauern,</b> müssen die Spieler fit sein.</div>
<div class="example good">Nachgestellt: Die Spieler müssen fit sein, <b>weil die Turniere lange dauern.</b></div>
<div class="example good">Eingeschoben: Der Spieler, <b>der gewonnen hat,</b> kommt aus Korea. → Komma davor UND danach!</div>
<h4>Besonderheiten</h4>
<ul><li>Gleichrangige Nebensätze mit <b>und/oder</b> verbunden → kein Komma: <i>Er hofft, dass er gewinnt <b>und</b> dass seine Fans jubeln.</i></li>
<li><b>Infinitivgruppen</b> – Komma ist Pflicht, wenn sie
 <br>① mit <i>um, ohne, statt, anstatt, außer, als</i> eingeleitet werden: <i>Er trainiert, um zu gewinnen.</i>
 <br>② von einem Nomen abhängen: <i>Sie hat den Wunsch, Profi zu werden.</i>
 <br>③ durch ein Verweiswort angekündigt werden: <i>Er liebt es, zu spielen. Sie denkt daran, aufzuhören.</i>
 <br>Sonst ist das Komma freigestellt.</li></ul>
<p class="merke"><b>Komma-Trick:</b> Markiere alle gebeugten Verben. Zwischen zwei Teilsätzen steht fast immer ein Komma.</p>`,
steps:`<ol><li>Unterstreiche alle gebeugten Verben (Personalformen).</li><li>Suche die Einleitewörter (weil, dass, der, die …).</li><li>Setze ein Komma vor jedes Einleitewort und nach dem Ende jedes Nebensatzes.</li><li>Eingeschoben? → Komma davor UND danach.</li></ol>`,
tasks:[

{id:'kommas-grundregeln',title:'Kommas richtig setzen',short:'Aufzählungen, Appositionen, Anreden, Gegensätze und nachgestellte Zusätze.',group:'Zeichensetzung',
info:`<table><tr><th>Regel</th><th>Beispiel</th></tr>
<tr><td><b>Aufzählungen</b> – Komma zwischen gleichrangigen Wörtern/Wortgruppen, aber <b>nicht</b> vor <i>und, oder, sowie</i></td><td>Präzision, Konzentration und Disziplin</td></tr>
<tr><td><b>Entgegensetzende Konjunktionen</b> – Komma vor <i>aber, sondern, doch, jedoch</i> (wenn sie Satzteile verbinden)</td><td>nicht gefährlich, sondern spannend</td></tr>
<tr><td><b>Apposition</b> (nachgestellte Beifügung) – Komma davor und danach</td><td>Manfred Spitzer, ein Hirnforscher, warnt …</td></tr>
<tr><td><b>Anrede und Ausruf</b></td><td>Lisa, kommst du? – Ach, schon vorbei!</td></tr>
<tr><td><b>Nachgestellte Erläuterungen</b> – eingeleitet mit <i>z. B., vor allem, insbesondere, und zwar, das heißt</i></td><td>Viele Genres sind beliebt, zum Beispiel Rollenspiele.</td></tr>
<tr><td><b>Hauptsätze ohne Konjunktion</b> (Satzreihe)</td><td>Sie spielt Fußball, er zockt lieber.</td></tr></table>
<p class="merke"><b>Kann-Komma:</b> Zwischen zwei Hauptsätzen, die mit <i>und/oder</i> verbunden sind, <b>darf</b> man ein Komma setzen, muss aber nicht. In den Klickaufgaben kommen nur Pflichtkommas vor.</p>`,
steps:`<ol><li>Gibt es eine Aufzählung? → Komma zwischen den Gliedern, nicht vor „und“.</li><li>Steht „aber/sondern/doch“ im Satz? → Komma davor.</li><li>Wird jemand angesprochen? → Komma nach dem Namen.</li><li>Wird etwas erklärt (ein Hirnforscher; zum Beispiel …)? → Komma.</li></ol>`,

{id:'das-dass',title:'Das oder dass?',short:'Artikel, Pronomen oder Konjunktion – mit der Ersatzprobe sicher entscheiden.',group:'Rechtschreibung',
info:`<table><tr><th>Wortart</th><th>Ersatzprobe</th><th>Beispiel</th></tr>
<tr><td><b>das</b> – Artikel</td><td>dieses/ein</td><td><u>Das</u> Turnier dauert vier Tage.</td></tr>
<tr><td><b>das</b> – Relativpronomen</td><td>welches</td><td>Das Spiel, <u>das</u> ich mag, ist ab 16.</td></tr>
<tr><td><b>das</b> – Demonstrativpronomen</td><td>dies/dieses</td><td><u>Das</u> ist nicht fair!</td></tr>
<tr><td><b>dass</b> – Konjunktion (Subjunktion)</td><td><b>nicht ersetzbar</b></td><td>Ich finde, <u>dass</u> E-Sport ein Sport ist.</td></tr></table>
<p><b>„dass“</b> leitet einen Nebensatz ein (Verb am Ende) und steht oft nach Verben des Sagens, Denkens und Fühlens: <i>glauben, meinen, hoffen, wissen, behaupten, sich freuen …</i> Feste Verbindungen: <i>sodass / so dass, ohne dass, anstatt dass</i>.</p>

<script>
/* ===================== LOGIK ===================== */
const KEY='deutsch10-lernmodul-v2';
let TESTHOOKS=[];
const LV={a:{name:'Anfänger',icon:'🌱',desc:'viel Hilfestellung: Auswahllisten, Tipps, Satzanfänge'},m:{name:'Mittelfeld',icon:'🧭',desc:'leichte Hilfestellung: Tipps auf Wunsch, Wortspeicher'},e:{name:'Experte',icon:'🎯',desc:'ohne Hilfestellung, mit Zusatz-Challenges'}};
const TYPES={mc:'Multiple Choice',gap:'Lückentext',comma:'Kommas setzen',errors:'Fehler finden',sort:'Zuordnen',write:'Schreibaufgabe',fix:'Text überarbeiten',transform:'Umformen',order:'Reihenfolge'};
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.lv&&s.sc){s.at=s.at||{};return s}}catch(e){}return{lv:{},sc:{},at:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent}
let uidc=0;const uid=()=>'u'+(++uidc);

function visibleTasks(t,lv){return t.tasks.map((k,i)=>({k,i})).filter(o=>!o.k.levels||o.k.levels.includes(lv))}
function topicProgress(t){const lv=state.lv[t.id];const sc=state.sc[t.id]||{};const list=lv?visibleTasks(t,lv):t.tasks.map((k,i)=>({k,i}));let done=0,sum=0;list.forEach(o=>{if(sc[o.i]!=null){done++;sum+=sc[o.i]}});return{done,total:list.length,avg:done?Math.round(sum/done*100):0}}
function att(t,i){state.at=state.at||{};state.at[t.id]=state.at[t.id]||{};return state.at[t.id][i]=state.at[t.id][i]||{n:0}}
function peekAtt(t,i){return((state.at||{})[t.id]||{})[i]||{n:0}}
function testDone(){return TEST.tasks.every((k,i)=>peekAtt(TEST,i).n>0)}
function award(t,i,f){
  const xp0=totalXP(),r0=rankOf(xp0);const msgs=[];const a=att(t,i);a.n++;a.best=Math.max(a.best||0,f);
  state.sc[t.id]=state.sc[t.id]||{};const sc=state.sc[t.id];let mode='none';
  if(t===TEST){if(a.n===1){sc[i]=f;mode='test'}}
  else if(a.n===1){sc[i]=f;a.f1=f;mode='first';
    if(f>=1){state.combo=(state.combo||0)+1;if(state.combo>=3){const b=10*Math.min(state.combo,5);state.bonus=(state.bonus||0)+b;msgs.push(['combo',`🔥 Combo ×${state.combo}! +${b} Bonus-XP`])}}else state.combo=0}
  else if(a.n===2&&!a.rev){sc[i]=Math.max(sc[i]||0,a.f1+Math.max(0,f-a.f1)*0.5);mode='second'}
  state.badges=state.badges||{};
  TOPICS.forEach((tp,ti)=>{if(!state.badges[tp.id]&&badgeEarned(tp)){state.badges[tp.id]=1;msgs.push(['badge',`${BADGES[ti].i} Abzeichen freigeschaltet: <b>${BADGES[ti].n}</b>`])}});
  save();
  const xp1=totalXP(),g=xp1-xp0,r1=rankOf(xp1);
  if(g>0)msgs.unshift(['xp',`+${g} XP`]);
  if(r1>r0)msgs.push(['rank',`${RANKS[r1].i} Aufstieg! Du bist jetzt <b>${RANKS[r1].n}</b>`]);
  msgs.forEach((m,k)=>setTimeout(()=>toast(m[1],m[0]),k*1000));
  updateTop();
  const bg=document.querySelector('.badgegoal');if(bg&&t!==TEST)bg.outerHTML=badgeGoal(t);
  return{mode,gained:g,n:a.n};
}
function updateTop(){const x=totalXP(),r=rankOf(x),nx=RANKS[r+1];const pct=nx?Math.round((x-RANKS[r].x)/(nx.x-RANKS[r].x)*100):100;
  $('#topstat').innerHTML=`${(state.combo||0)>=2?`<span class="combo">🔥×${state.combo}</span>`:''}<span>${RANKS[r].i} <b>${RANKS[r].n}</b> · ${x} XP</span><span class="xpbar" title="${nx?`noch ${nx.x-x} XP bis ${nx.n}`:'Höchster Rang erreicht'}"><i style="width:${pct}%"></i></span>`;buildBar()}

/* ---------- Routing ---------- */
const ALL=()=>[...TOPICS,TEST];

  let revB=null;

    revB.onclick=()=>{if(!revB.dataset.c){revB.dataset.c=1;revB.textContent='Sicher? Danach gibt es für diese Aufgabe keine XP mehr – nochmal klicken';return}
      const a=att(t,i);a.rev=true;save();api.reveal?api.reveal():api.check(true);
      ctx.note('🔓 Lösung aufgedeckt. Diese Aufgabe ist jetzt im Übungsmodus – es gibt keine weiteren XP dafür.','mid');revB.remove();revB=null;setStat()};
    actions.append(revB)}
  const a0=peekAtt(t,i);
  if(isTest&&a0.n>0){lock();ctx.note(`✔ Bereits abgegeben (${Math.round(((state.sc[t.id]||{})[i]||0)*100)} %).`+(testDone()?'':' Die Lösungen kannst du ansehen, sobald alle Aufgaben abgegeben sind.'),'ok');if(testDone())solBtn();return}
  const chk=el('button','btn',isTest?'✅ Abgeben':task.type==='write'?'Text prüfen':'Überprüfen');
  chk.onclick=()=>{
    const a=peekAtt(t,i);
    if(isTest&&a.n>0)return;
    if(isTest&&!chk.dataset.c){chk.dataset.c=1;chk.textContent='Wirklich abgeben? Danach kannst du nichts mehr ändern – nochmal klicken';return}
    const show=!isTest&&(a.n+1>=2||a.rev);
    const res=api.check(show);if(!res)return;
    const f=res.f!=null?res.f:(res.tot?res.r/res.tot:0);
    const out=award(t,i,f);
    const pc=Math.round(f*100);
    let msg=(pc===100?'🎉 Super, alles richtig! ':pc>=60?'👍 Gut! ':'🔁 Da geht noch was. ')+(res.r!=null?`(${res.r} von ${res.tot} richtig)`:`(${pc} %)`);
    let info='';
    if(isTest)info='Abgegeben. '+(testDone()?'Alle Aufgaben sind abgegeben – unten findest du dein Gesamtergebnis.':'Die Lösungen siehst du, wenn alle Aufgaben abgegeben sind.');
    else if(out.mode==='first')info=`⭐ +${out.gained} XP im 1. Versuch.`+(pc<100?' Verbessere deine Antworten und prüfe ein zweites Mal – dafür gibt es noch halbe Punkte. Die Lösungen siehst du nach dem 2. Versuch.':'');
    else if(out.mode==='second')info=`⭐ +${out.gained} XP im 2. Versuch (halbe Punkte für deine Verbesserung). Die Lösungen sind jetzt eingeblendet.`;
    else info='📘 Übungsmodus – für diese Aufgabe gibt es keine weiteren XP.'+(show?' Die Lösungen sind eingeblendet.':'');
    if(res.warn)info=res.warn+' '+info;
    fb.className='fb show '+(pc===100?'ok':pc>=60?'mid':'bad');
    fb.innerHTML=msg+`<div style="font-weight:400;margin-top:.3rem">${info}${res.extra?'<br>'+res.extra:''}</div>`;
    setStat();
    if(isTest){lock();chk.remove();document.querySelectorAll('.seg button').forEach(b=>b.disabled=true);TESTHOOKS.forEach(fn=>fn())}
    else{if(show&&revB){revB.remove();revB=null}else if(!show)addReveal()}
  };
  actions.append(chk);
  if(!isTest){
    if(a0.n===1&&!a0.rev)addReveal();
    const rs=el('button','btn ghost','Eingaben löschen');rs.onclick=()=>renderTask(t,task,i,n,lv,holder);actions.append(rs);
  }else{TESTHOOKS.push(()=>{if(testDone()&&peekAtt(t,i).n>0)solBtn()})}
}

R.gap=(task,c,lv)=>{
  const mode=lv==='a'?'select':lv==='m'?(task.mMode||'bank'):'input';
  const gaps=[];
  const html=task.text.replace(/\[\[(.+?)\]\]/g,(m,inner)=>{const parts=inner.split('|');const acc=parts[0].split('/');gaps.push({acc,opts:shuffle([acc[0],...parts.slice(1)])});return `<span class="gslot" data-g="${gaps.length-1}"></span>`});
  if(mode==='bank'){const b=el('div','bank','<span class="lbl">Wortspeicher (anklicken setzt das Wort in das zuletzt gewählte Feld):</span>');shuffle(gaps.map(g=>g.acc[0])).forEach(w=>{const bt=el('button',null,w);bt.type='button';bt.onclick=()=>{const inp=c.last||c.body.querySelector('input.gap');if(inp){inp.value=w;bt.classList.add('used');const nx=[...c.body.querySelectorAll('input.gap')].find(x=>!x.value);if(nx){nx.focus();c.last=nx}}};b.append(bt)});c.body.append(b)}
  const wrap=el('div','gaptext',html);c.body.append(wrap);
  const inputs=gaps.map((g,gi)=>{const slot=wrap.querySelector(`[data-g="${gi}"]`);let inp;
    if(mode==='select'){inp=el('select','gap');inp.append(el('option',null,'– wählen –'));inp.firstChild.value='';g.opts.forEach(o=>{const op=el('option',null,o);op.value=o;inp.append(op)})}
    else{inp=el('input','gap');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.style.width=Math.max(5,Math.max(...g.opts.map(o=>o.length))+2)+'ch';inp.onfocus=()=>c.last=inp}
    slot.replaceWith(inp);const sol=el('span','sol');inp.after(sol);return{inp,sol,g}});
  return{check(show){let r=0;inputs.forEach(({inp,sol,g})=>{const v=inp.value.trim().replace(/\s+/g,' ');const ok=g.acc.includes(v);inp.classList.toggle('right',ok);inp.classList.toggle('wrong',!ok);sol.textContent=(!ok&&show)?'→ '+g.acc[0]:'';if(ok)r++});return{r,tot:inputs.length,extra:show?'':'Rot = noch falsch.'}}};
};

R.comma=(task,c,lv)=>{
  const rows=task.items.map((it,si)=>{
    const toks=it.s.split(' ');const sol=new Set();const words=toks.map((w,k)=>{if(w.endsWith(',')){sol.add(k);return w.slice(0,-1)}return w});

    if(lv!=='e')row.append(el('span','cnt',`(${sol.size} ${sol.size===1?'Komma':'Kommas'})`));

R.errors=(task,c,lv)=>{
  const units=[];const re=/\{([^{}>]+)>([^{}|]+)\|([A-Z]+)\}/g;let last=0,m;
  const pushPlain=s=>s.split(/\s+/).filter(Boolean).forEach(w=>units.push({t:w}));
  while((m=re.exec(task.text))){pushPlain(task.text.slice(last,m.index));units.push({t:m[1],err:{r:m[2],cat:m[3]}});last=re.lastIndex}
  pushPlain(task.text.slice(last));
  const errs=units.filter(u=>u.err);
  if(lv!=='e'){let h=`Im Text sind <b>${errs.length} Fehler</b> versteckt.`;if(lv==='a'){const cnt={};errs.forEach(u=>cnt[u.err.cat]=(cnt[u.err.cat]||0)+1);h+=' Fehlerarten: '+Object.keys(cnt).map(k=>`${CATS[k]} (${cnt[k]}×)`).join(', ')+'.'}c.body.append(el('div','help',h))}
  const box=el('div','etext');
  const spans=units.map(u=>{const s=el('span','unit',u.t);s.onclick=()=>{clear();s.classList.toggle('mk')};box.append(s,document.createTextNode(' '));return s});
  function clear(){spans.forEach(s=>{s.classList.remove('found','missed','falsemk');const sp=s.querySelector('sup');if(sp)sp.remove()})}
  c.body.append(box);
  c.body.append(el('div','legend','<span>🟨 markiert</span><span style="color:var(--ok)">🟩 Fehler gefunden</span><span style="color:var(--warn)">🟧 Fehler übersehen (erst bei der Lösung)</span><span style="color:var(--bad)">🟥 war eigentlich richtig</span>'));
  return{check(show){clear();let found=0,falsem=0;units.forEach((u,k)=>{const s=spans[k];const mk=s.classList.contains('mk');
      if(u.err){if(mk){s.classList.add('found');s.append(el('sup',null,'→ '+u.err.r));found++}else if(show){s.classList.add('missed');s.append(el('sup',null,'→ '+u.err.r))}}
      else if(mk){s.classList.add('falsemk');falsem++}});
    return{r:Math.max(0,found-falsem),tot:errs.length,extra:`Gefunden: ${found} von ${errs.length}${falsem?` · ${falsem} richtige Wörter fälschlich markiert (zählt als Abzug)`:''}.`}}};
};

R.sort=(task,c,lv)=>{

R.order=(task,c,lv)=>{
  c.body.append(el('p','olabel','Deine Reihenfolge:'));

  for(let k=0;k<fixed;k++){const b=mk(task.pieces[k],k);b.classList.add('fixed');ans.append(b)}
  const rest=task.pieces.map((p,k)=>({p,k})).slice(fixed);let sh=shuffle(rest);if(sh.every((o,j)=>o.k===rest[j].k)&&sh.length>1)sh.reverse();

const norm=(s,keepComma)=>s.toLowerCase().replace(/[„“"‚‘'»«]/g,'').replace(keepComma?/[.!?:;]/g:/[.,!?:;]/g,' ').replace(/\s*,\s*/g,', ').replace(/\s+/g,' ').trim();
R.transform=(task,c,lv)=>{
  const rows=task.items.map((it,k)=>{const d=el('div','titem');d.append(el('div','src',`${k+1}. ${it.src}`));if(lv==='a'&&it.h)d.append(el('p','minihint','💡 '+it.h));const inp=el('input','tin');inp.type='text';inp.placeholder='Deine Lösung …';inp.spellcheck=false;d.append(inp);const res=el('div');d.append(res);c.body.append(d);return{it,inp,res}});
  return{check(show){let r=0;rows.forEach(({it,inp,res})=>{const v=norm(inp.value,task.strictPunct);const ok=!!v&&it.acc.some(a=>norm(a,task.strictPunct)===v);inp.classList.toggle('right',ok);inp.classList.toggle('wrong',!ok);
      res.innerHTML=ok||!show?'':`<div class="model"><b>Mögliche Lösung:</b> ${it.acc[0]}${it.acc.length>1?'<br><b>oder:</b> '+it.acc[1]:''}<br><small>Weicht deine Lösung nur in der Wortstellung ab, kann sie trotzdem richtig sein – vergleiche genau.</small></div>`;if(ok)r++});
    return{r,tot:rows.length,extra:show?'':'Gelb = stimmt noch nicht mit einer erwarteten Lösung überein. Prüfe Konjunktiv, Pronomen und Kommas.'}}};
};

function stats(text){const t=text.replace(/\s+/g,' ').trim();if(!t)return{words:0,sent:[],longest:0,avg:0,commas:0};const sent=t.split(/(?<=[.!?])\s+/).filter(Boolean).map(s=>({s,w:s.split(' ').filter(w=>/[A-Za-zÄÖÜäöüß0-9]/.test(w)).length}));const words=sent.reduce((a,b)=>a+b.w,0);return{words,sent,longest:Math.max(...sent.map(x=>x.w)),avg:Math.round(words/sent.length*10)/10,commas:(t.match(/,/g)||[]).length}}
function lcs(a,b){const n=a.length,m=b.length;const d=Array.from({length:n+1},()=>new Int16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);const keepA=new Set();let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){keepA.add(i);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return{len:d[0][0],keepA}}
const toks=s=>s.toLowerCase().replace(/[.,!?;:„“"()–-]/g,' ').split(/\s+/).filter(Boolean);
R.write=(task,c,lv)=>{
  if(task.source&&!task.prefill)c.body.append(el('div','src src-src',task.source));
  const ta=el('textarea');ta.placeholder='Schreibe hier …';if(task.prefill)ta.value=task.source;
  function ins(s){const p=ta.selectionStart??ta.value.length;ta.value=ta.value.slice(0,p)+s+ta.value.slice(p);ta.focus();ta.selectionStart=ta.selectionEnd=p+s.length}
  if(task.bank&&lv!=='e'){const b=el('div','bank','<span class="lbl">Wortspeicher:</span>');task.bank.forEach(w=>{const bt=el('button',null,w);bt.type='button';bt.onclick=()=>ins(w+' ');b.append(bt)});c.body.append(b)}
  if(task.starters&&lv==='a'){const s=el('div','starters');task.starters.forEach(w=>{const bt=el('button',null,w);bt.type='button';bt.onclick=()=>ins((ta.value&&!/\n$/.test(ta.value)?'\n':'')+w.replace(/ …$/,' '));s.append(bt)});c.body.append(s)}
  c.body.append(ta);
  const ana=el('div'),chk=el('div','check'),model=el('div');c.body.append(ana,chk,model);
  const showModel=()=>{if(task.model)model.innerHTML=`<div class="model"><b>Musterlösung</b> (eine von vielen Möglichkeiten):<br>${task.model.replace(/\n/g,'<br>')}</div>`};
  return{check(show){
    const st=stats(ta.value);const li=[];
    li.push(['inf',`${st.words} Wörter, ${st.sent.length} Sätze, durchschnittlich ${st.avg||0} Wörter pro Satz`]);
    if(task.minWords)li.push([st.words>=task.minWords?'ok':'no',`Mindestens ${task.minWords} Wörter`]);
    if(task.maxLen){const long=st.sent.filter(x=>x.w>task.maxLen);li.push([long.length?'no':'ok',long.length?`${long.length} Satz/Sätze länger als ${task.maxLen} Wörter (längster: ${st.longest}) – noch kürzen!`:`Kein Satz länger als ${task.maxLen} Wörter`])}
    const low=' '+ta.value.toLowerCase().replace(/[.,!?;:„“"()]/g,' ')+' ';
    if(task.minConnectors){const found=CONNECTORS.filter(k=>low.includes(' '+k+' '));li.push([found.length>=task.minConnectors?'ok':'no',`Mindestens ${task.minConnectors} verschiedene Konnektoren (gefunden: ${found.length?found.join(', '):'keine'})`])}
    if(task.maxRepeat){const nn=(ta.value.toLowerCase().match(new RegExp(task.maxRepeat.word.replace('-','\\-'),'g'))||[]).length;li.push([nn<=task.maxRepeat.max?'ok':'no',`„E-Sport“ kommt ${nn}-mal vor (Ziel: höchstens ${task.maxRepeat.max})`])}
    if(task.minKonj){const f=KONJ.filter(k=>low.includes(' '+k+' '));li.push([f.length>=task.minKonj?'ok':'no',`Konjunktivformen (mind. ${task.minKonj}): ${f.length?f.join(', '):'keine gefunden'}`])}
    if(task.noQuotes){const q=/[„“"]/.test(ta.value);li.push([q?'no':'ok',q?'Es stehen noch Anführungszeichen im Text – indirekte Rede braucht keine.':'Keine Anführungszeichen (gut für indirekte Rede)'])}
    if(task.minCommas)li.push([st.commas>=task.minCommas?'ok':'no',`Kommas im Text: ${st.commas||0} (erwartet: mind. ${task.minCommas})`]);
    if(task.mustInclude)task.mustInclude.forEach(w=>{const has=low.includes(' '+w.toLowerCase()+' ');li.push([has?'ok':'no',`enthält „${w}“`])});
    ana.className='analysis';ana.innerHTML='<b>Automatische Rückmeldung</b><ul>'+li.map(([k,v])=>`<li class="${k}">${v}</li>`).join('')+'</ul>';
    if(task.checklist&&!chk.innerHTML)chk.innerHTML='<b>Selbstcheck – hake ab, was zutrifft:</b>'+task.checklist.map(x=>`<label><input type="checkbox"> ${x}</label>`).join('');
    const auto=li.filter(x=>x[0]!=='inf');const okc=auto.filter(x=>x[0]==='ok').length;
    let f=auto.length?okc/auto.length:1,warn='';
    if(task.model){const mt=toks(task.model);const sim=lcs(toks(ta.value),mt).len/mt.length;if(sim>=0.6){f=0;warn='⚠️ Dein Text stimmt größtenteils mit der Musterlösung überein – dafür gibt es keine XP. Formuliere selbst!'}}
    if(task.prefill&&toks(ta.value).join(' ')===toks(task.source).join(' ')){f=0;warn='⚠️ Du hast den Text noch nicht verändert.'}
    if(show)showModel();
    return{r:f===0&&warn?0:okc,tot:auto.length||1,f,warn,extra:'Nutze zusätzlich den Selbstcheck.'}},
    reveal:showModel};
};

R.fix=(task,c,lv)=>{
  const ta=el('textarea');ta.value=task.start;ta.spellcheck=false;c.body.append(ta);
  const out=el('div'),sol=el('div');c.body.append(out,sol);
  const tg=task.target.split(/\s+/);const st=task.start.split(/\s+/);const totalErr=Math.max(1,Math.max(st.length,tg.length)-lcs(st,tg).len);
  const showSol=()=>{sol.innerHTML=`<div class="model"><b>Lösung:</b><br>${task.target}</div>`};
  return{check(show){const u=ta.value.trim().split(/\s+/);const {len,keepA}=lcs(u,tg);const diffs=Math.max(u.length-len,tg.length-len);const fixed=Math.max(0,totalErr-diffs);
    if(lv==='a'&&diffs)out.innerHTML='<p class="olabel">Rot markiert = hier stimmt noch etwas nicht:</p><div class="diff">'+u.map((w,k)=>keepA.has(k)?w:`<span class="x">${w}</span>`).join(' ')+'</div>';else out.innerHTML='';
    if(show)showSol();
    return{r:diffs?fixed:totalErr,tot:totalErr,extra:diffs?`Es gibt noch ${diffs} ${diffs===1?'Stelle':'Stellen'}, die nicht stimmen.`:'Der Text ist fehlerfrei!'}},
    reveal:showSol};
};

/* ---------- Lehrkraft-Bereich ---------- */
const LEHRER_CODE='arena2026';
let teacherOK=false;
function makeCode(){const xp=Math.min(9999,totalXP()),pc=state.trophyPc||0,b=TOPICS.filter((t,i)=>hasBadge(i)).length,lv=['a','m','e'].indexOf(state.lv[TEST.id]||'m'),rv=Math.min(99,revealCount());const n=((((xp*101+pc)*11+b)*3+Math.max(0,lv))*100+rv);const v=n*9973+(n%9973);return v.toString(36).toUpperCase().replace(/(.{4})(?=.)/g,'$1-')}
function readCode(code){const v=parseInt(code.replace(/[^0-9a-z]/gi,'').toLowerCase(),36);if(!isFinite(v))return null;const n=Math.floor(v/9973);if(v%9973!==n%9973)return null;let x=n;const rv=x%100;x=Math.floor(x/100);const lv=x%3;x=Math.floor(x/3);const b=x%11;x=Math.floor(x/11);const pc=x%101;const xp=Math.floor(x/101);return{xp,pc,b,lv:['a','m','e'][lv],rv}}
function revealCount(t){let c=0;Object.entries(state.at||{}).forEach(([id,o])=>{if(t&&id!==t.id)return;Object.values(o).forEach(a=>{if(a.rev)c++})});return c}
function renderTeacher(){
  const app=$('#app');app.innerHTML='';const bk=el('a','back','← Zur Übersicht');bk.href='#';app.append(bk);
  app.append(el('h1',null,'🔒 Lehrkraft-Bereich'));
  if(!teacherOK){const f=el('div','chooser','<p>Bitte Lehrkraft-Code eingeben:</p>');const i=el('input','tin');i.type='password';i.style.maxWidth='280px';const b=el('button','btn','Entsperren');b.style.marginLeft='.5rem';const m=el('p','time');
    b.onclick=()=>{if(i.value.trim()===LEHRER_CODE){teacherOK=true;renderTeacher()}else m.textContent='Falscher Code.'};i.onkeydown=e=>{if(e.key==='Enter')b.click()};f.append(i,b,m);app.append(f);return}
  const d=el('div','task');d.innerHTML='<h3>Prüfcode einer Urkunde lesen</h3><p class="prompt">Gib den Prüfcode von der Urkunde ein. Stimmen die Werte nicht mit der Urkunde überein, wurde sie verändert.</p>';
  const i=el('input','tin');i.placeholder='z. B. AB12-CD34-EF';const b=el('button','btn','Prüfen');const out=el('div','analysis');out.style.display='none';
  b.onclick=()=>{const r=readCode(i.value);out.style.display='block';out.innerHTML=r?`<b>✔ Gültiger Code</b><ul><li class="inf">Finale: ${r.pc} % (Niveau: ${LV[r.lv].name})</li><li class="inf">XP: ${r.xp}</li><li class="inf">Abzeichen: ${r.b}/10</li><li class="inf">Aufgedeckte Lösungen: ${r.rv}</li></ul>`:'<b style="color:var(--bad)">✘ Ungültiger Code</b> – vermutlich abgetippt mit Fehler oder verändert.'};
  d.append(i,el('div','actions'));d.lastChild.append(b);d.append(out);app.append(d);
  const r=el('div','task');r.innerHTML='<h3>Auf diesem Gerät zurücksetzen</h3><p class="prompt">Nur für Lehrkräfte: z. B. wenn ein Schüler das Finale wiederholen darf oder ein neuer Schüler an diesem Gerät arbeitet.</p>';
  const a=el('div','actions');
  const b1=el('button','btn ghost','Finale zurücksetzen');b1.onclick=()=>{if(!b1.dataset.c){b1.dataset.c=1;b1.textContent='Wirklich? Nochmal klicken';return}delete state.sc[TEST.id];if(state.at)delete state.at[TEST.id];delete state.lv[TEST.id];delete state.finalPc;save();updateTop();b1.textContent='✔ Finale zurückgesetzt'};
  const b2=el('button','btn ghost','Gesamten Fortschritt löschen');b2.onclick=()=>{if(!b2.dataset.c){b2.dataset.c=1;b2.textContent='Wirklich ALLES löschen? Nochmal klicken';return}state={lv:{},sc:{},at:{}};save();updateTop();b2.textContent='✔ Alles gelöscht'};
  a.append(b1,b2);r.append(a);app.append(r);
}

route();
</script>
</body>
